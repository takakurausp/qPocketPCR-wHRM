; PlatformIO project configuration for qPocketPCR-wHRM
; Target: ESP32-S2 with NATIVE USB (CDC + MSC) — matches firmware usage of USB.h/USBMSC.h and Serial
; NOTE: ARDUINO_USB_MODE must be 0 (or undefined) so that USBCDC "Serial" is declared.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; build_flags for the default environment. The TFT_* defines mirror the original
; project's TFT_eSPI setup (User_Setups/Setup_qPCR.h): ILI9341 on
; MOSI=35, SCLK=36, CS=34, DC=37, RST=10 at 40 MHz, with the GFX FreeFonts loaded.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=-1
    -DTFT_MOSI=35
    -DTFT_SCLK=36
    -DTFT_CS=34
    -DTFT_DC=37
    -DTFT_RST=10
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000

[env:esp32_s2_usb_native]
board = esp32-s2-usb-native
lib_deps =
    bodmer/TFT_eSPI
    ../qPocketPCR-main/Software/Libraries/TLC59108-main
    adafruit/Adafruit TLA202x
    adafruit/Adafruit FT6206 Library

; WiFi enabled build (WIFI_ENABLED=1, default) — web server + named-protocol save.
[env:esp32_s2_usb_native_wifi]
board = esp32-s2-usb-native
lib_deps =
    bodmer/TFT_eSPI
    ../qPocketPCR-main/Software/Libraries/TLC59108-main
    adafruit/Adafruit TLA202x
    adafruit/Adafruit FT6206 Library
; The TFT_* defines mirror the original project's TFT_eSPI setup
; (User_Setups/Setup_qPCR.h): ILI9341 on MOSI=35, SCLK=36, CS=34, DC=37,
; RST=10 at 40 MHz, with the GFX FreeFonts loaded.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=-1
    -DTFT_MOSI=35
    -DTFT_SCLK=36
    -DTFT_CS=34
    -DTFT_DC=37
    -DTFT_RST=10
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DWIFI_ENABLED=1

; WiFi disabled build (WIFI_ENABLED=0, radio-law compliant) — no AP/web server.
[env:esp32_s2_usb_native_nofw]
board = esp32-s2-usb-native
lib_deps =
    bodmer/TFT_eSPI
    ../qPocketPCR-main/Software/Libraries/TLC59108-main
    adafruit/Adafruit TLA202x
    adafruit/Adafruit FT6206 Library
; The TFT_* defines mirror the original project's TFT_eSPI setup
; (User_Setups/Setup_qPCR.h): ILI9341 on MOSI=35, SCLK=36, CS=34, DC=37,
; RST=10 at 40 MHz, with the GFX FreeFonts loaded.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=-1
    -DTFT_MOSI=35
    -DTFT_SCLK=36
    -DTFT_CS=34
    -DTFT_DC=37
    -DTFT_RST=10
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DWIFI_ENABLED=0
